<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro — target-app</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Crear cuenta</h1>
      <p class="subtitle">App de prueba para el pipeline de QA — no es un producto real.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="off" />
          <span id="name-error" class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="text" autocomplete="off" />
          <span id="email-error" class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="off" />
          <span id="password-error" class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="confirm-password">Confirmar contraseña</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="off" />
          <span id="confirm-error" class="error" role="alert"></span>
        </div>

        <div class="field field-checkbox">
          <label for="terms">
            <input id="terms" name="terms" type="checkbox" />
            Acepto los términos y condiciones
          </label>
          <span id="terms-error" class="error" role="alert"></span>
        </div>

        <button id="submit-btn" type="submit">Registrarse</button>
      </form>

      <p id="success-message" class="success" hidden>Registro exitoso.</p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
